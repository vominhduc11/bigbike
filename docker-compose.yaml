services:

  postgres:
    image: postgres:16-alpine
    container_name: bigbike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigbike}
      POSTGRES_USER: ${POSTGRES_USER:-bigbike}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}"
    # log_min_duration_statement: was off by default (no way to see which queries are slow
    # without it — see BIGBIKE_PERFORMANCE_AUDIT_CHECKLIST.md). effective_cache_size/
    # shared_buffers: sized for this container's 512m memory limit below instead of
    # Postgres's out-of-the-box defaults (effective_cache_size defaults to 4GB, which
    # assumes a much bigger host than this container actually gets).
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - effective_cache_size=300MB
      - -c
      - shared_buffers=128MB
    # Slow-query logging adds log volume that wasn't there before — cap it so it can't
    # fill the disk (host is already tight on space; see project ops notes).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigbike} -d ${POSTGRES_DB:-bigbike}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bigbike-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set - see .env.example}"
    ports:
      - "0.0.0.0:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bigbike-backend:
    build:
      context: ./bigbike-backend
      dockerfile: Dockerfile
    container_name: bigbike-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BIGBIKE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bigbike}
      BIGBIKE_DB_USERNAME: ${POSTGRES_USER:-bigbike}
      BIGBIKE_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}"
      BIGBIKE_JWT_SECRET: "${BIGBIKE_JWT_SECRET:?BIGBIKE_JWT_SECRET must be set - generate with openssl rand -base64 48}"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set - see .env.example}"
      MINIO_BUCKET: ${MINIO_BUCKET:-bigbike-media}
      # NOTE: backend application.properties reads ${CORS_ALLOWED_ORIGINS}, so inject under that exact name.
      CORS_ALLOWED_ORIGINS: "${BIGBIKE_CORS_ALLOWED_ORIGINS:?BIGBIKE_CORS_ALLOWED_ORIGINS must be set - e.g. https://bigbike.vn,https://www.bigbike.vn}"
      # Reverse-proxy IPs trusted to set X-Forwarded-For (per-IP rate limiting). Accepts exact IPs
      # or CIDR ranges. When the backend sits behind nginx / a Docker bridge, set this to the
      # proxy IP or subnet — otherwise rate limiting collapses to one shared bucket.
      BIGBIKE_TRUSTED_PROXIES: "${BIGBIKE_TRUSTED_PROXIES:-127.0.0.1,::1}"
      # Public-facing canonical URLs used in transactional email templates and admin links.
      BIGBIKE_SITE_BASE_URL: "${BIGBIKE_SITE_BASE_URL:-https://bigbike.vn}"
      BIGBIKE_ADMIN_BASE_URL: "${BIGBIKE_ADMIN_BASE_URL:-https://admin.bigbike.vn}"
      # Media URL allowlist anchor (admin write paths).
      # Must be the browser-accessible URL — NOT the Docker-internal minio:9000 hostname.
      # Defaults to localhost:9000 (port-mapped MinIO). Override in production with a CDN URL.
      BIGBIKE_MEDIA_PUBLIC_BASE_URL: "${BIGBIKE_MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/bigbike-media}"
      BIGBIKE_COOKIES_SECURE: "${BIGBIKE_COOKIES_SECURE:-true}"
      WEB_REVALIDATE_URL: "${WEB_REVALIDATE_URL:-http://bigbike-web:3000/api/revalidate/}"
      WEB_REVALIDATE_SECRET: "${WEB_REVALIDATE_SECRET:-dev-revalidate-secret}"
      # VI→EN auto-translation (server-side Gemini). Blank disables it; saves still work.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      # Transactional email (optional — empty BIGBIKE_MAIL_HOST disables sending).
      BIGBIKE_MAIL_HOST: "${BIGBIKE_MAIL_HOST:-}"
      BIGBIKE_MAIL_PORT: "${BIGBIKE_MAIL_PORT:-587}"
      BIGBIKE_MAIL_USERNAME: "${BIGBIKE_MAIL_USERNAME:-}"
      BIGBIKE_MAIL_PASSWORD: "${BIGBIKE_MAIL_PASSWORD:-}"
      BIGBIKE_MAIL_SMTP_AUTH: "${BIGBIKE_MAIL_SMTP_AUTH:-true}"
      BIGBIKE_MAIL_STARTTLS: "${BIGBIKE_MAIL_STARTTLS:-true}"
      BIGBIKE_MAIL_FROM: "${BIGBIKE_MAIL_FROM:-no-reply@bigbike.vn}"
      BIGBIKE_MAIL_ADMIN: "${BIGBIKE_MAIL_ADMIN:-info@bigbike.vn}"
      BIGBIKE_MAIL_VERIFY_BASE_URL: "${BIGBIKE_MAIL_VERIFY_BASE_URL:-https://bigbike.vn/xac-nhan-email}"
      BIGBIKE_MAIL_RESET_BASE_URL: "${BIGBIKE_MAIL_RESET_BASE_URL:-https://bigbike.vn/quen-mat-khau}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  bigbike-web:
    build:
      context: ./bigbike-web
      dockerfile: Dockerfile
      args:
        # Bake MinIO origin into CSP img-src at build time.
        # Set BIGBIKE_LEGACY_UPLOADS_BASE in .env to your browser-reachable MinIO URL.
        BIGBIKE_LEGACY_UPLOADS_BASE: ${BIGBIKE_LEGACY_UPLOADS_BASE:-http://localhost:9000/bigbike-media/wp-uploads}
        # Server-side rewrite destination: Next.js server (inside Docker) must reach
        # MinIO via the internal Docker network name, not localhost.
        BIGBIKE_MEDIA_INTERNAL_URL: ${BIGBIKE_MEDIA_INTERNAL_URL:-http://minio:9000/bigbike-media/wp-uploads}
        # NEXT_PUBLIC_ vars are baked into the client bundle at build time.
        # For local dev localhost:8080 is correct (port-mapped backend).
        # For production set NEXT_PUBLIC_API_BASE_URL=https://api.bigbike.vn in .env.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # Admin app origin allowed to embed the storefront live-preview iframe (/preview/*)
        # and checked on postMessage. Local default = localhost:4000; for production set
        # NEXT_PUBLIC_ADMIN_ORIGIN=https://admin.bigbike.vn in .env.
        NEXT_PUBLIC_ADMIN_ORIGIN: ${NEXT_PUBLIC_ADMIN_ORIGIN:-http://localhost:4000}
    container_name: bigbike-web
    restart: unless-stopped
    depends_on:
      bigbike-backend:
        condition: service_healthy
    # Bind to loopback only — production traffic must arrive via the nginx reverse proxy
    # (TLS, rate limit, security headers). localhost access for local dev still works.
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      BIGBIKE_API_BASE_URL: http://bigbike-backend:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      BIGBIKE_SITE_URL: ${BIGBIKE_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_ORIGIN: ${NEXT_PUBLIC_ADMIN_ORIGIN:-http://localhost:4000}
      BIGBIKE_DISABLE_DEV_FALLBACK: "true"
      REVALIDATE_SECRET: "${WEB_REVALIDATE_SECRET:-dev-revalidate-secret}"
      BIGBIKE_REDIRECT_CACHE_TTL_SECONDS: "${BIGBIKE_REDIRECT_CACHE_TTL_SECONDS:-300}"
      # Google Tag Manager — leave empty in staging to avoid GA4 pollution.
      NEXT_PUBLIC_GTM_ID: "${NEXT_PUBLIC_GTM_ID:-}"
      # Sentry — server-side DSN + source map upload credentials.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN:-}"
      SENTRY_ORG: "${SENTRY_ORG:-}"
      SENTRY_PROJECT: "${SENTRY_PROJECT:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bigbike-admin:
    build:
      context: ./bigbike-admin
      dockerfile: Dockerfile
      args:
        # Vite bakes these at build time — pass as build args, not runtime env.
        # API calls use a relative path so nginx can proxy them inside the container.
        VITE_ADMIN_API_BASE: /api/v1
        # Docker-internal MinIO origin for rewriting backend URLs to /media-proxy/.
        VITE_MINIO_INTERNAL_ORIGIN: http://minio:9000
        # Storefront origin for "view on site" links AND the product/article live-preview
        # iframe src (browser-accessible URL). Local default = localhost:3000; for production
        # set VITE_STOREFRONT_BASE_URL=https://bigbike.vn in .env.
        VITE_STOREFRONT_BASE_URL: ${VITE_STOREFRONT_BASE_URL:-http://localhost:3000}
    container_name: bigbike-admin
    restart: unless-stopped
    depends_on:
      bigbike-backend:
        condition: service_healthy
    # Bind to loopback only — the admin dashboard must not be reachable on an external
    # interface without the nginx reverse proxy in front of it.
    ports:
      - "4000:80"
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # NOTE: the former `bigbike-web-init` one-shot revalidate container was removed —
  # bigbike-web now self-revalidates on startup via docker-entrypoint.mjs, which also
  # covers partial `--no-deps` rebuilds the external init container was skipped for.

networks:
  default:
    name: bigbike-dev

volumes:
  postgres_data:
  minio_data:
