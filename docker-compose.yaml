services:

  postgres:
    image: postgres:16-alpine
    container_name: bigbike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigbike}
      POSTGRES_USER: ${POSTGRES_USER:-bigbike}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}"
    # log_min_duration_statement: was off by default (no way to see which queries are slow
    # without it — see BIGBIKE_PERFORMANCE_AUDIT_CHECKLIST.md). effective_cache_size/
    # shared_buffers: sized for this container's 512m memory limit below instead of
    # Postgres's out-of-the-box defaults (effective_cache_size defaults to 4GB, which
    # assumes a much bigger host than this container actually gets).
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - effective_cache_size=300MB
      - -c
      - shared_buffers=128MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - idle_in_transaction_session_timeout=30000
    # Slow-query logging adds log volume that wasn't there before — cap it so it can't
    # fill the disk (host is already tight on space; see project ops notes).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigbike} -d ${POSTGRES_DB:-bigbike}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Development/test-only shared limiter store. Production must point
  # BIGBIKE_RATE_LIMIT_REDIS_URL at managed HA Redis with TLS/ACL instead.
  redis:
    image: redis:7.4-alpine
    container_name: bigbike-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bigbike-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set - see .env.example}"
    # Bind to loopback only (AUD-009) — production traffic must arrive via the nginx
    # reverse proxy; direct external access to MinIO would bypass TLS/rate limiting.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bigbike-backend:
    build:
      context: ./bigbike-backend
      dockerfile: Dockerfile
    container_name: bigbike-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Domain cutover 2026-08-06 (AUD-009): loopback only — public traffic must come
    # through nginx (https://api.bigbike.vn). Trước đó cổng này mở 0.0.0.0 nên
    # /v3/api-docs gọi thẳng qua IP:8080 được, bỏ qua mọi rule của nginx.
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Deployment-specific: bỏ qua các migration đã chạy nhưng không còn trên
      # classpath của profile hiện tại (VPS đã chạy 14 migration dev V1001..V1015
      # trước khi chuyển sang prod). Để trống ở môi trường mới -> Flyway kiểm tra
      # như cũ. Lưu ý phải gồm cả `*:future`, không chỉ `*:missing`: V1001+ cao
      # hơn mọi version trên classpath nên Flyway xếp vào nhóm "future".
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "${SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS:-}"
      # Hệ quả của V1001+ đã applied: mọi migration prod MỚI (V371 trở đi) có số
      # thấp hơn 1015 nên bị Flyway xếp vào nhóm "ignored" và KHÔNG chạy. Bật cờ
      # này để chúng vẫn được áp dụng. Môi trường mới không dính -> mặc định false.
      SPRING_FLYWAY_OUT_OF_ORDER: "${SPRING_FLYWAY_OUT_OF_ORDER:-false}"
      BIGBIKE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bigbike}
      BIGBIKE_DB_USERNAME: ${POSTGRES_USER:-bigbike}
      BIGBIKE_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}"
      BIGBIKE_JWT_SECRET: "${BIGBIKE_JWT_SECRET:?BIGBIKE_JWT_SECRET must be set - generate with openssl rand -base64 48}"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set - see .env.example}"
      MINIO_BUCKET: ${MINIO_BUCKET:-bigbike-media}
      # NOTE: backend application.properties reads ${CORS_ALLOWED_ORIGINS}, so inject under that exact name.
      CORS_ALLOWED_ORIGINS: "${BIGBIKE_CORS_ALLOWED_ORIGINS:?BIGBIKE_CORS_ALLOWED_ORIGINS must be set - e.g. https://bigbike.vn,https://www.bigbike.vn}"
      # Reverse-proxy IPs trusted to set X-Forwarded-For (per-IP rate limiting). This narrow
      # compose network CIDR lets the backend trust the web/admin bridge hop in local dev.
      # Production must explicitly override it with verified ingress/container source CIDRs.
      BIGBIKE_TRUSTED_PROXIES: "${BIGBIKE_TRUSTED_PROXIES:-127.0.0.1,::1,172.20.0.0/24}"
      # Local Compose may use the service above. A prod profile rejects this non-TLS
      # service name even if a secret is set; production must use managed rediss:// Redis.
      # Targets the Redis health indicator at the Compose service; without it the
      # indicator probes localhost inside the container and reports DOWN.
      BIGBIKE_REDIS_HOST: "${BIGBIKE_REDIS_HOST:-redis}"
      BIGBIKE_REDIS_PORT: "${BIGBIKE_REDIS_PORT:-6379}"
      BIGBIKE_RATE_LIMIT_ENABLED: "${BIGBIKE_RATE_LIMIT_ENABLED:-true}"
      BIGBIKE_RATE_LIMIT_STORE: "${BIGBIKE_RATE_LIMIT_STORE:-redis}"
      BIGBIKE_RATE_LIMIT_REDIS_URL: "${BIGBIKE_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}"
      BIGBIKE_RATE_LIMIT_REDIS_TIMEOUT_MS: "${BIGBIKE_RATE_LIMIT_REDIS_TIMEOUT_MS:-100}"
      BIGBIKE_RATE_LIMIT_HMAC_SECRET: "${BIGBIKE_RATE_LIMIT_HMAC_SECRET:-}"
      BIGBIKE_RATE_LIMIT_FALLBACK_MAX_ENTRIES: "${BIGBIKE_RATE_LIMIT_FALLBACK_MAX_ENTRIES:-50000}"
      BIGBIKE_RATE_LIMIT_LOCAL_ENTRY_TTL_MULTIPLIER: "${BIGBIKE_RATE_LIMIT_LOCAL_ENTRY_TTL_MULTIPLIER:-2}"
      # Explicit pass-through keeps owner-approved tier overrides usable with Compose's
      # allowlist-style environment section. Empty values resolve to the catalog defaults.
      BIGBIKE_RATE_LIMIT_TIERS_LOGIN_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_LOGIN_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_LOGIN_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_LOGIN_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REGISTER_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_REGISTER_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REGISTER_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_REGISTER_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_PASSWORD_RESET_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_PASSWORD_RESET_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_PASSWORD_RESET_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_PASSWORD_RESET_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_RESEND_VERIFICATION_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_RESEND_VERIFICATION_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_RESEND_VERIFICATION_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_RESEND_VERIFICATION_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REFRESH_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_REFRESH_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REFRESH_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_REFRESH_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MUTATION_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MUTATION_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MUTATION_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MUTATION_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MEDIA_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MEDIA_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MEDIA_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_CUSTOMER_MEDIA_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CHECKOUT_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_CHECKOUT_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CHECKOUT_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_CHECKOUT_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ORDER_LOOKUP_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ORDER_LOOKUP_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ORDER_LOOKUP_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ORDER_LOOKUP_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_SEARCH_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_SEARCH_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_SEARCH_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_SEARCH_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REVIEW_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_REVIEW_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REVIEW_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_REVIEW_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REVIEW_PHOTO_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_REVIEW_PHOTO_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_REVIEW_PHOTO_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_REVIEW_PHOTO_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CHAT_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_CHAT_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_CHAT_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_CHAT_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_OAUTH_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_OAUTH_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_OAUTH_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_OAUTH_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MUTATION_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MUTATION_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MUTATION_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MUTATION_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MEDIA_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MEDIA_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MEDIA_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_MEDIA_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_VALIDATE_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_VALIDATE_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_VALIDATE_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_VALIDATE_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_COMMIT_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_COMMIT_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_COMMIT_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_IMPORT_COMMIT_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_EXPORT_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_EXPORT_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_ADMIN_EXPORT_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_ADMIN_EXPORT_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_INTERNAL_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_INTERNAL_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_INTERNAL_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_INTERNAL_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_HANDSHAKE_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_HANDSHAKE_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_HANDSHAKE_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_HANDSHAKE_WINDOW:-}"
      BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_COMMAND_LIMIT: "${BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_COMMAND_LIMIT:-}"
      BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_COMMAND_WINDOW: "${BIGBIKE_RATE_LIMIT_TIERS_WEBSOCKET_COMMAND_WINDOW:-}"
      # Public-facing canonical URLs used in transactional email templates and admin links.
      BIGBIKE_SITE_BASE_URL: "${BIGBIKE_SITE_BASE_URL:-https://bigbike.vn}"
      BIGBIKE_ADMIN_BASE_URL: "${BIGBIKE_ADMIN_BASE_URL:-https://admin.bigbike.vn}"
      # Media URL allowlist anchor (admin write paths).
      # Must be the browser-accessible URL — NOT the Docker-internal minio:9000 hostname.
      # Defaults to localhost:9000 (port-mapped MinIO). Override in production with a CDN URL.
      BIGBIKE_MEDIA_PUBLIC_BASE_URL: "${BIGBIKE_MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/bigbike-media}"
      BIGBIKE_COOKIES_SECURE: "${BIGBIKE_COOKIES_SECURE:-true}"
      # Cookie Domain for the customer cookies. Blank = host-only (correct for localhost, where
      # web:3000 and api:8080 share a host). When the storefront and API sit on different hosts
      # of the same site (bigbike.vn + api.bigbike.vn), set the registrable domain — otherwise
      # bb_csrf is unreadable from the storefront and every customer mutation 403s.
      BIGBIKE_COOKIES_DOMAIN: "${BIGBIKE_COOKIES_DOMAIN:-}"
      # Shared secret for /api/internal/** (redirect lookups from bigbike-web's proxy.ts).
      # Must equal INTERNAL_API_TOKEN on bigbike-web below. Empty in dev is fine (allow-open=true
      # in application-dev.properties); empty in prod = redirect feature silently disabled (401s, fail-open).
      BIGBIKE_INTERNAL_TOKEN: "${BIGBIKE_INTERNAL_TOKEN:-}"
      WEB_REVALIDATE_URL: "${WEB_REVALIDATE_URL:-http://bigbike-web:3000/api/revalidate/}"
      WEB_REVALIDATE_SECRET: "${WEB_REVALIDATE_SECRET:-dev-revalidate-secret}"
      WEB_REDIRECT_CACHE_CLEAR_URL: "${WEB_REDIRECT_CACHE_CLEAR_URL:-}"
      WEB_REVALIDATE_EXPECTED_REPLICAS: "${WEB_REVALIDATE_EXPECTED_REPLICAS:-0}"
      # Transactional email (optional — empty BIGBIKE_MAIL_HOST disables sending).
      BIGBIKE_MAIL_HOST: "${BIGBIKE_MAIL_HOST:-}"
      BIGBIKE_MAIL_PORT: "${BIGBIKE_MAIL_PORT:-587}"
      BIGBIKE_MAIL_USERNAME: "${BIGBIKE_MAIL_USERNAME:-}"
      BIGBIKE_MAIL_PASSWORD: "${BIGBIKE_MAIL_PASSWORD:-}"
      BIGBIKE_MAIL_SMTP_AUTH: "${BIGBIKE_MAIL_SMTP_AUTH:-true}"
      BIGBIKE_MAIL_STARTTLS: "${BIGBIKE_MAIL_STARTTLS:-true}"
      BIGBIKE_MAIL_FROM: "${BIGBIKE_MAIL_FROM:-no-reply@bigbike.vn}"
      BIGBIKE_MAIL_FROM_NAME: "${BIGBIKE_MAIL_FROM_NAME:-BigBike}"
      # One required deployment source for internal order + staff-handoff notifications.
      # Leave empty here so the backend's startup validator reports a missing declaration;
      # never silently fall back to a mailbox embedded in Compose or Java code.
      BIGBIKE_MAIL_ADMIN: "${BIGBIKE_MAIL_ADMIN:-}"
      BIGBIKE_MAIL_VERIFY_BASE_URL: "${BIGBIKE_MAIL_VERIFY_BASE_URL:-https://bigbike.vn/xac-nhan-email}"
      BIGBIKE_MAIL_RESET_BASE_URL: "${BIGBIKE_MAIL_RESET_BASE_URL:-https://bigbike.vn/quen-mat-khau}"
      # Admin invite set-password page (AUD-061). Without this the backend fell back to its
      # application.properties default (http://localhost:4000/accept-invite) — invite emails
      # sent from a deployed stack pointed staff to localhost.
      BIGBIKE_MAIL_ADMIN_INVITE_BASE_URL: "${BIGBIKE_MAIL_ADMIN_INVITE_BASE_URL:-https://admin.bigbike.vn/accept-invite}"
      # Optional Telegram new-order alert. Blank token or chat id disables it safely.
      BIGBIKE_TELEGRAM_BOT_TOKEN: "${BIGBIKE_TELEGRAM_BOT_TOKEN:-}"
      BIGBIKE_TELEGRAM_CHAT_ID: "${BIGBIKE_TELEGRAM_CHAT_ID:-}"
      BIGBIKE_TELEGRAM_API_BASE_URL: "${BIGBIKE_TELEGRAM_API_BASE_URL:-}"
      BIGBIKE_TELEGRAM_TIMEOUT_SECONDS: "${BIGBIKE_TELEGRAM_TIMEOUT_SECONDS:-}"
      # Automatic review invitations: true by default; false is the emergency server switch.
      BIGBIKE_REVIEW_INVITATION_ENABLED: "${BIGBIKE_REVIEW_INVITATION_ENABLED:-true}"
      # Social login (AUD-062): forward the six OAuth vars — without them the backend saw
      # blank client ids inside Docker and social login was silently disabled.
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CLIENT_ID: "${OAUTH_FACEBOOK_CLIENT_ID:-}"
      OAUTH_FACEBOOK_CLIENT_SECRET: "${OAUTH_FACEBOOK_CLIENT_SECRET:-}"
      OAUTH_CALLBACK_BASE_URL: "${OAUTH_CALLBACK_BASE_URL:-http://localhost:8080}"
      OAUTH_WEB_SUCCESS_URL: "${OAUTH_WEB_SUCCESS_URL:-http://localhost:3000}"
      # Automatic review moderation (REVIEW_RULE_012/013). An empty key is a supported
      # state: the moderator reports SKIPPED and every review stays in Pending, exactly
      # as it behaved before the feature existed.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-${VITE_GEMINI_API_KEY:-}}"
      BIGBIKE_REVIEW_MODERATION_MODEL: "${BIGBIKE_REVIEW_MODERATION_MODEL:-gemini-2.5-flash}"
      BIGBIKE_REVIEW_MODERATION_TIMEOUT_SECONDS: "${BIGBIKE_REVIEW_MODERATION_TIMEOUT_SECONDS:-20}"
      BIGBIKE_CHAT_MODEL: "${BIGBIKE_CHAT_MODEL:-gemini-3.7-flash}"
      BIGBIKE_CHAT_TIMEOUT_SECONDS: "${BIGBIKE_CHAT_TIMEOUT_SECONDS:-65}"
      MINIO_CHAT_PRIVATE_BUCKET: "${MINIO_CHAT_PRIVATE_BUCKET:-bigbike-chat-private}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  bigbike-web:
    build:
      context: ./bigbike-web
      dockerfile: Dockerfile
      args:
        # Bake MinIO origin into CSP img-src at build time.
        # Set BIGBIKE_LEGACY_UPLOADS_BASE in .env to your browser-reachable MinIO URL.
        BIGBIKE_LEGACY_UPLOADS_BASE: ${BIGBIKE_LEGACY_UPLOADS_BASE:-http://localhost:9000/bigbike-media/wp-uploads}
        # Server-side rewrite destination: Next.js server (inside Docker) must reach
        # MinIO via the internal Docker network name, not localhost.
        BIGBIKE_MEDIA_INTERNAL_URL: ${BIGBIKE_MEDIA_INTERNAL_URL:-http://minio:9000/bigbike-media/wp-uploads}
        # NEXT_PUBLIC_ vars are baked into the client bundle at build time.
        # For local dev localhost:8080 is correct (port-mapped backend).
        # For production set NEXT_PUBLIC_API_BASE_URL=https://api.bigbike.vn in .env.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # Admin app origin allowed to embed the storefront live-preview iframe (/preview/*)
        # and checked on postMessage. Local default = localhost:4000; for production set
        # NEXT_PUBLIC_ADMIN_ORIGIN=https://admin.bigbike.vn in .env.
        NEXT_PUBLIC_ADMIN_ORIGIN: ${NEXT_PUBLIC_ADMIN_ORIGIN:-http://localhost:4000}
        # Google Analytics 4 measurement id. MUST be a build arg: the storefront fires its
        # events from the browser, and a NEXT_PUBLIC_ value that is only supplied at runtime
        # has already been compiled out of the client bundle as `undefined` — one of the two
        # reasons the previous Google Tag Manager install stayed silent (the other being that
        # its id was left blank everywhere). Empty → no script at all.
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
    container_name: bigbike-web
    restart: unless-stopped
    depends_on:
      bigbike-backend:
        condition: service_healthy
    # Domain cutover 2026-08-06 (AUD-009): loopback only — public traffic must come
    # through nginx (https://bigbike.vn).
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      BIGBIKE_API_BASE_URL: http://bigbike-backend:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      BIGBIKE_SITE_URL: ${BIGBIKE_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_ORIGIN: ${NEXT_PUBLIC_ADMIN_ORIGIN:-http://localhost:4000}
      BIGBIKE_DISABLE_DEV_FALLBACK: "true"
      REVALIDATE_SECRET: "${WEB_REVALIDATE_SECRET:-dev-revalidate-secret}"
      BIGBIKE_REDIRECT_CACHE_TTL_SECONDS: "${BIGBIKE_REDIRECT_CACHE_TTL_SECONDS:-300}"
      # Must equal BIGBIKE_INTERNAL_TOKEN on bigbike-backend above.
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
      # Google Analytics 4 — also passed as a build arg above (that is the one the browser
      # actually reads). Leave empty in staging to avoid polluting the live property.
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: "${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}"
      # Sentry — server-side DSN + source map upload credentials.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN:-}"
      SENTRY_ORG: "${SENTRY_ORG:-}"
      SENTRY_PROJECT: "${SENTRY_PROJECT:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bigbike-admin:
    build:
      context: ./bigbike-admin
      dockerfile: Dockerfile
      args:
        # Vite bakes these at build time — pass as build args, not runtime env.
        # API calls use a relative path so nginx can proxy them inside the container.
        VITE_ADMIN_API_BASE: /api/v1
        # Docker-internal MinIO origin for rewriting backend URLs to /media-proxy/.
        VITE_MINIO_INTERNAL_ORIGIN: http://minio:9000
        # Optional comma-separated legacy media origins. Blank by default; never bake a retired
        # production host into the admin bundle implicitly.
        VITE_MINIO_EXTRA_ORIGINS: ${VITE_MINIO_EXTRA_ORIGINS:-}
        # Storefront origin for "view on site" links AND the product/article live-preview
        # iframe src (browser-accessible URL). Local default = localhost:3000; for production
        # set VITE_STOREFRONT_BASE_URL=https://bigbike.vn in .env.
        VITE_STOREFRONT_BASE_URL: ${VITE_STOREFRONT_BASE_URL:-http://localhost:3000}
    container_name: bigbike-admin
    restart: unless-stopped
    depends_on:
      bigbike-backend:
        condition: service_healthy
    # Domain cutover 2026-08-06 (AUD-009): loopback only — public traffic must come
    # through nginx (https://admin.bigbike.vn).
    ports:
      - "127.0.0.1:4000:80"
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # NOTE: the former `bigbike-web-init` one-shot revalidate container was removed —
  # bigbike-web now self-revalidates on startup via docker-entrypoint.mjs, which also
  # covers partial `--no-deps` rebuilds the external init container was skipped for.

networks:
  default:
    name: bigbike-dev

volumes:
  postgres_data:
  minio_data:
