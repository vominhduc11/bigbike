<!DOCTYPE html>
<html lang="vi" data-dir="b" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProductList — BigBike Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="proto">
  <div class="proto-bar" id="protoBar"></div>
  <div class="proto-stage" id="stage">
    <div class="app-viewport">
      <div class="app-shell" id="shell">
        <div class="scrim" data-close-nav></div>
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
          <div class="ptopbar" id="ptopbar"></div>
          <div class="pcrumb" id="pcrumb"></div>
          <div class="pcontent">
            <div class="screen" data-screen-label="ProductList">

              <!-- ScreenHeader -->
              <div class="screen-head">
                <div>
                  <p class="sh-eyebrow">Danh mục</p>
                  <h1>Sản phẩm <span class="badge badge-neutral" id="totalBadge">142 xe</span></h1>
                  <p class="sh-desc">Quản lý toàn bộ xe đang bán tại cửa hàng. Bấm vào một dòng để xem &amp; sửa chi tiết.</p>
                </div>
                <div class="sh-actions">
                  <button class="btn btn-secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Nhập Excel</button>
                  <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Thêm sản phẩm</button>
                </div>
              </div>

              <!-- FilterBar -->
              <div class="toolbar">
                <div class="toolbar-row">
                  <label class="search-field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input id="search" placeholder="Tìm theo tên hoặc mã SKU…" />
                  </label>
                  <select class="f-select" id="brandFilter">
                    <option value="">Tất cả thương hiệu</option>
                    <option>Honda</option><option>Yamaha</option><option>Kawasaki</option>
                    <option>Ducati</option><option>BMW</option><option>KTM</option>
                    <option>Triumph</option><option>Suzuki</option>
                  </select>
                  <select class="f-select" id="sortSelect">
                    <option value="name">Sắp xếp: Tên A→Z</option>
                    <option value="price-desc">Giá cao → thấp</option>
                    <option value="price-asc">Giá thấp → cao</option>
                    <option value="stock-asc">Tồn kho thấp nhất</option>
                  </select>
                  <div class="seg-control" id="density" style="margin-left:auto">
                    <button data-density="" aria-pressed="true">Thoáng</button>
                    <button data-density="compact" aria-pressed="false">Đặc</button>
                  </div>
                </div>
                <div class="toolbar-row">
                  <div class="seg-control" id="statusFilter">
                    <button data-status="all" aria-pressed="true">Tất cả <span class="cnt">9</span></button>
                    <button data-status="selling" aria-pressed="false">Đang bán <span class="cnt">5</span></button>
                    <button data-status="low" aria-pressed="false">Sắp hết <span class="cnt">2</span></button>
                    <button data-status="out" aria-pressed="false">Hết hàng <span class="cnt">1</span></button>
                    <button data-status="draft" aria-pressed="false">Nháp <span class="cnt">1</span></button>
                  </div>
                  <div class="filter-chips" id="chips"></div>
                </div>
              </div>

              <!-- Bulk bar (conditional) -->
              <div id="bulkSlot"></div>

              <!-- Desktop table -->
              <div class="tbl-wrap responsive">
                <table class="tbl" id="tbl">
                  <thead>
                    <tr>
                      <th style="width:44px"><span class="cbx" id="selAll" role="checkbox" aria-checked="false" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span></th>
                      <th class="sortable" data-sort="name">Sản phẩm</th>
                      <th>Thương hiệu</th>
                      <th class="sortable align-right" data-sort="price">Giá bán</th>
                      <th class="align-right">Tồn kho</th>
                      <th>Trạng thái</th>
                      <th class="align-right">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="tbody"></tbody>
                </table>
              </div>

              <!-- Mobile cards -->
              <div class="mcard-list" id="mlist"></div>

              <!-- Pagination -->
              <div class="pagination">
                <span class="pg-info">Hiển thị <b>1–9</b> trong <b>142</b> sản phẩm</span>
                <div class="pg-nav">
                  <button class="pg-btn" disabled aria-label="Trang trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
                  <button class="pg-btn" aria-current="true">1</button>
                  <button class="pg-btn">2</button>
                  <button class="pg-btn">3</button>
                  <span style="color:var(--text-faint);padding:0 4px">…</span>
                  <button class="pg-btn">16</button>
                  <button class="pg-btn" aria-label="Trang sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-region" aria-live="polite"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0d1117"/><text x="50" y="46" font-family="Arial" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">BIG</text><circle cx="50" cy="57" r="4.5" fill="#cc4a08"/><text x="50" y="79" font-family="Arial" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">BIKE</text></svg>
</template>

<script src="shell.js"></script>
<script>
BB.mountShell({
  active:"products", pageTitle:"Sản phẩm", protoTitle:"ProductListScreen · desktop + mobile",
  crumb:["Trang chủ","Danh mục","Sản phẩm"]
});

const PRODUCTS = [
  { id:1, name:"Honda CB650R", sku:"SP-CB650R-25", brand:"Honda", price:298000000, stock:12, status:"selling" },
  { id:2, name:"Kawasaki Z900", sku:"SP-Z900-24", brand:"Kawasaki", price:359000000, stock:3, status:"low" },
  { id:3, name:"Yamaha MT-09 SP", sku:"SP-MT09-24", brand:"Yamaha", price:279000000, stock:0, status:"out" },
  { id:4, name:"Ducati Monster 937", sku:"SP-MON937-25", brand:"Ducati", price:449000000, stock:5, status:"selling" },
  { id:5, name:"BMW R 1250 GS", sku:"SP-R1250GS-24", brand:"BMW", price:689000000, stock:2, status:"low" },
  { id:6, name:"KTM 390 Duke", sku:"SP-390DUKE-25", brand:"KTM", price:189000000, stock:8, status:"selling" },
  { id:7, name:"Honda Africa Twin", sku:"SP-AFRTWIN-25", brand:"Honda", price:612000000, stock:0, status:"draft" },
  { id:8, name:"Triumph Street Triple", sku:"SP-STRPL-24", brand:"Triumph", price:389000000, stock:6, status:"selling" },
  { id:9, name:"Suzuki GSX-S1000", sku:"SP-GSXS1K-25", brand:"Suzuki", price:329000000, stock:4, status:"selling" },
];
const STATUS = {
  selling:{ cls:"badge-success", t:"Đang bán" },
  low:    { cls:"badge-warning", t:"Sắp hết" },
  out:    { cls:"badge-danger",  t:"Hết hàng" },
  draft:  { cls:"badge-neutral", t:"Nháp" },
};
const vnd = n => n.toLocaleString("vi-VN") + " ₫";
const PH = '<div class="ph-img">ảnh xe</div>';

let state = { q:"", brand:"", status:"all", sort:"name", selected:new Set(), hidden:new Set() };

function filtered() {
  let rows = PRODUCTS.filter(p => !state.hidden.has(p.id));
  if (state.q) { const q=state.q.toLowerCase(); rows = rows.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)); }
  if (state.brand) rows = rows.filter(p => p.brand===state.brand);
  if (state.status!=="all") rows = rows.filter(p => p.status===state.status);
  rows = rows.slice().sort((a,b) => {
    if (state.sort==="name") return a.name.localeCompare(b.name);
    if (state.sort==="price-desc") return b.price-a.price;
    if (state.sort==="price-asc") return a.price-b.price;
    if (state.sort==="stock-asc") return a.stock-b.stock;
    return 0;
  });
  return rows;
}

function rowHTML(p) {
  const sel = state.selected.has(p.id);
  const s = STATUS[p.status];
  const stockCls = p.stock===0 ? "color:var(--danger);font-weight:600" : p.stock<=3 ? "color:var(--warning);font-weight:600" : "";
  return `<tr class="${sel?'is-selected':''}" data-id="${p.id}">
    <td><span class="cbx ${sel?'checked':''}" role="checkbox" aria-checked="${sel}" tabindex="0" data-pick="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span></td>
    <td><div class="prod-cell"><div class="prod-thumb">${PH}</div><div><div class="nm">${p.name}</div><div class="sku">${p.sku}</div></div></div></td>
    <td><span class="muted-cell" style="color:var(--text-secondary)">${p.brand}</span></td>
    <td class="align-right"><span class="price">${vnd(p.price)}</span></td>
    <td class="align-right"><span class="muted-cell" style="${stockCls}">${p.stock}</span></td>
    <td><span class="badge ${s.cls}"><span class="dot"></span>${s.t}</span></td>
    <td><div class="row-actions">
      <button class="icon-btn" aria-label="Sửa ${p.name}" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn" aria-label="Ẩn ${p.name}" data-hide="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M6.6 6.6A18 18 0 0 0 2 12s3 8 10 8a9 9 0 0 0 4.4-1.1M3 3l18 18"/></svg></button>
    </div></td>
  </tr>`;
}

function cardHTML(p) {
  const sel = state.selected.has(p.id);
  const s = STATUS[p.status];
  const stockCls = p.stock===0 ? "color:var(--danger)" : p.stock<=3 ? "color:var(--warning)" : "";
  return `<div class="mcard" data-id="${p.id}">
    <div class="mcard-top">
      <span class="cbx ${sel?'checked':''}" role="checkbox" aria-checked="${sel}" tabindex="0" data-pick="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>
      <div class="prod-thumb">${PH}</div>
      <div class="mc-main"><div class="nm">${p.name}</div><div class="sku">${p.sku} · ${p.brand}</div></div>
      <span class="badge ${s.cls}"><span class="dot"></span>${s.t}</span>
    </div>
    <div class="mcard-foot">
      <div class="mcard-meta">
        <div class="m"><span class="l">Giá bán</span><span class="v">${vnd(p.price)}</span></div>
        <div class="m"><span class="l">Tồn kho</span><span class="v" style="${stockCls}">${p.stock}</span></div>
      </div>
      <button class="btn btn-secondary btn-sm" data-edit="${p.id}">Sửa</button>
    </div>
  </div>`;
}

function renderChips() {
  const chips = [];
  if (state.brand) chips.push({ k:"brand", t:state.brand });
  if (state.status!=="all") chips.push({ k:"status", t:STATUS[state.status].t });
  if (state.q) chips.push({ k:"q", t:`"${state.q}"` });
  const el = document.getElementById("chips");
  if (!chips.length) { el.innerHTML=""; return; }
  el.innerHTML = chips.map(c => `<span class="chip">${c.t}<button data-clear="${c.k}" aria-label="Bỏ lọc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>`).join("")
    + `<button class="chip-clear" data-clear="all">Xoá tất cả bộ lọc</button>`;
}

function renderBulk() {
  const slot = document.getElementById("bulkSlot");
  const n = state.selected.size;
  if (!n) { slot.innerHTML=""; return; }
  slot.innerHTML = `<div class="bulk-bar">
    <span class="bb-count"><b>${n}</b> sản phẩm đã chọn</span>
    <div class="bb-actions">
      <button class="bb-btn" data-bulk="selling"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Đặt Đang bán</button>
      <button class="bb-btn" data-bulk="hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M3 3l18 18"/></svg>Ẩn</button>
      <button class="bb-btn danger" data-bulk="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Xoá</button>
    </div>
  </div>`;
}

function syncSelAll() {
  const rows = filtered();
  const all = document.getElementById("selAll");
  const picked = rows.filter(p => state.selected.has(p.id)).length;
  all.classList.toggle("checked", picked>0 && picked===rows.length);
  all.classList.toggle("indet", picked>0 && picked<rows.length);
  all.setAttribute("aria-checked", picked===0 ? "false" : picked===rows.length ? "true" : "mixed");
}

function render() {
  const rows = filtered();
  document.getElementById("tbody").innerHTML = rows.map(rowHTML).join("") || `<tr><td colspan="7" style="padding:0"><div class="empty" style="border:none;border-radius:0"><div class="ill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h3>Không tìm thấy sản phẩm</h3><p>Thử đổi từ khoá hoặc bỏ bớt bộ lọc.</p></div></td></tr>`;
  document.getElementById("mlist").innerHTML = rows.map(cardHTML).join("") || `<div class="empty"><div class="ill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h3>Không tìm thấy sản phẩm</h3><p>Thử đổi từ khoá hoặc bỏ bớt bộ lọc.</p></div>`;
  renderChips(); renderBulk(); syncSelAll();
}

function togglePick(id) {
  id = +id;
  if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
  render();
}

// events
document.getElementById("search").addEventListener("input", e => { state.q=e.target.value.trim(); render(); });
document.getElementById("brandFilter").addEventListener("change", e => { state.brand=e.target.value; render(); });
document.getElementById("sortSelect").addEventListener("change", e => { state.sort=e.target.value; render(); });
document.getElementById("statusFilter").addEventListener("click", e => {
  const b=e.target.closest("[data-status]"); if(!b) return;
  document.querySelectorAll("#statusFilter [data-status]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  state.status=b.dataset.status; render();
});
document.getElementById("density").addEventListener("click", e => {
  const b=e.target.closest("[data-density]"); if(!b) return;
  document.querySelectorAll("#density [data-density]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  document.getElementById("tbl").classList.toggle("compact", b.dataset.density==="compact");
});
document.getElementById("selAll").addEventListener("click", () => {
  const rows = filtered();
  const picked = rows.filter(p=>state.selected.has(p.id)).length;
  if (picked===rows.length) rows.forEach(p=>state.selected.delete(p.id));
  else rows.forEach(p=>state.selected.add(p.id));
  render();
});
document.addEventListener("click", e => {
  const pick=e.target.closest("[data-pick]"); if(pick){ togglePick(pick.dataset.pick); return; }
  const clr=e.target.closest("[data-clear]"); if(clr){ const k=clr.dataset.clear;
    if(k==="all"){ state.brand="";state.status="all";state.q=""; document.getElementById("search").value="";document.getElementById("brandFilter").value="";
      document.querySelectorAll("#statusFilter [data-status]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.status==="all")); }
    else if(k==="brand"){ state.brand="";document.getElementById("brandFilter").value=""; }
    else if(k==="status"){ state.status="all"; document.querySelectorAll("#statusFilter [data-status]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.status==="all")); }
    else if(k==="q"){ state.q="";document.getElementById("search").value=""; }
    render(); return; }
  const hide=e.target.closest("[data-hide]"); if(hide){ const id=+hide.dataset.hide; const p=PRODUCTS.find(x=>x.id===id);
    state.hidden.add(id); state.selected.delete(id); render();
    BB.toast({ msg:`Đã ẩn <b>${p.name}</b>`, onUndo:()=>{ state.hidden.delete(id); render(); } }); return; }
  const edit=e.target.closest("[data-edit]"); if(edit){ window.location.href="product-detail.html"; return; }
  const bulk=e.target.closest("[data-bulk]"); if(bulk){ const n=state.selected.size; const act=bulk.dataset.bulk;
    const ids=[...state.selected];
    if(act==="hide"||act==="delete"){ ids.forEach(id=>state.hidden.add(id)); state.selected.clear(); render();
      BB.toast({ msg:`Đã ${act==="delete"?"xoá":"ẩn"} <b>${n}</b> sản phẩm`, danger:act==="delete", onUndo:()=>{ ids.forEach(id=>state.hidden.delete(id)); render(); } }); }
    else { state.selected.clear(); render(); BB.toast({ msg:`Đã đặt <b>${n}</b> sản phẩm sang Đang bán`, undo:false }); }
    return; }
});

render();
</script>
</body>
</html>
