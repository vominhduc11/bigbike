# NON_KEYWORDS=VALUE: H2 treats VALUE as a reserved word but PostgreSQL (production) does not.
# Migration V252 creates a column literally named `value` (product_purchase_lines.value) which
# stays valid in prod; the table is dropped at V276 but V252 still runs first, so keep this relaxed.
spring.datasource.url=jdbc:h2:mem:bigbike;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates schema from entities. Main Flyway migrations use PostgreSQL-specific
# syntax (USING column::type in ALTER COLUMN) that H2 cannot parse.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Enable dev header auth bypass in the test environment so existing tests using
# X-Admin-Role / X-Admin-Permissions headers continue to work.
# AdminMediaP0Test overrides this to false via @TestPropertySource to test the disabled path.
bigbike.auth.dev-header-enabled=true

# Integration fixtures deliberately share a mock remote address and run unrelated flows in one
# cached Spring context. Rate-limit behavior is covered by isolated limiter tests instead.
bigbike.rate-limit.enabled=false

# Required by DataInitializer (no default since we removed admin123 hardcode)
bigbike.seed.admin-password=Test@Seed!12345

# Shared internal notification recipient required by the startup validator.
bigbike.mail.admin=bigbike-test@example.test

# Internal redirect endpoints: open without token in tests (no token configured).
# CMS-002: allow-open=true in test profile mirrors the dev profile so internal redirect
# tests pass without needing to set BIGBIKE_INTERNAL_TOKEN in the test environment.
bigbike.internal.allow-open=true

# Minio: use fixed test credentials so MinioClient can be instantiated even without a
# running MinIO server. The bucket init will fail gracefully (caught in ensureBucket).
bigbike.minio.endpoint=http://localhost:9000
bigbike.minio.access-key=test-access-key
bigbike.minio.secret-key=test-secret-key
bigbike.minio.bucket=bigbike-test

# ── OpenAPI sinh tự động (springdoc) ───────────────────────────────────────
# LƯU Ý: file này THAY THẾ TOÀN BỘ src/main/resources/application.properties khi chạy test
# (Spring Boot chỉ nạp một classpath:/application.properties duy nhất, bản trong test-resources
# đứng trước trên classpath). Vì vậy mọi thiết lập springdoc cần cho test phải lặp lại ở đây —
# không thừa. Thiếu springdoc.api-docs.path, springdoc sẽ đăng ký mặc định /v3/api-docs và
# đụng OpenApiStaticController, làm ứng dụng không khởi động được.
#
# Bật ở test để OpenApiContractDriftTest đối chiếu đặc tả sinh từ controller với hợp đồng
# biên tập tay. Mặc định của ứng dụng là TẮT ở mọi profile (xem application.properties).
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs/live
springdoc.packages-to-scan=com.bigbike.bigbike_backend.api
springdoc.swagger-ui.enabled=false
