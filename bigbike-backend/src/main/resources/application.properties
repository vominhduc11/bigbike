spring.application.name=bigbike-backend

spring.datasource.url=${BIGBIKE_DB_URL:jdbc:postgresql://localhost:5432/bigbike}
spring.datasource.username=${BIGBIKE_DB_USERNAME:bigbike}
spring.datasource.password=${BIGBIKE_DB_PASSWORD:bigbike_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool — applies to every profile (moved off the prod-only file; the live
# deployment runs the "dev" Spring profile, which silently left the pool at Hikari's
# 10-connection default). Sized well under Postgres max_connections (100 by default) for a
# single backend instance; revisit if the backend is ever horizontally scaled.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
# Ghi cảnh báo kèm vị trí mượn kết nối sau 5 giây để chẩn đoán kết nối bị giữ;
# không cắt câu hỏi hợp lệ. PostgreSQL chỉ tự kết thúc giao dịch nhàn rỗi bị bỏ dở.
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Response compression — applies to every profile (see Hikari comment above for why this
# moved off the prod-only file: profile should decide Flyway/logging/dev tooling, not
# whether responses are compressed).
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
server.compression.min-response-size=2048

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Hibernate performance — batch fetch collapses N+1 lazy-collection loads
# (product gallery/videos/specs/variants/options) into IN(...) batches;
# jdbc.batch_size + order_inserts/updates group bulk INSERT/UPDATE flushes.
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Query-count diagnostics — OFF by default (adds per-request overhead so it must stay opt-in
# on the live deployment). Set BIGBIKE_HIBERNATE_STATS=true temporarily to count SQL queries
# per request when investigating N+1 (see BIGBIKE_PERFORMANCE_AUDIT_CHECKLIST.md). The debug
# log level is harmless when stats are off — Hibernate never calls it, so nothing is logged.
spring.jpa.properties.hibernate.generate_statistics=${BIGBIKE_HIBERNATE_STATS:false}
logging.level.org.hibernate.stat=debug

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS configuration
bigbike.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4000,http://localhost:4001}

# Cookie security — set to false only in local dev without HTTPS
bigbike.cookies.secure=${BIGBIKE_COOKIES_SECURE:true}

# Cookie Domain for the customer cookies (bb_session / bb_csrf / bb_refresh / bb_guest_id).
# Blank = host-only, correct for local dev where web and API share a host and differ only by
# port. When the storefront and the API live on different hosts of the same site
# (bigbike.vn + api.bigbike.vn), set the registrable domain — e.g. BIGBIKE_COOKIES_DOMAIN=.bigbike.vn
# Without it, bb_csrf issued by api.bigbike.vn is unreadable from bigbike.vn and every
# customer mutation (cart, checkout, profile, reviews) fails with 403 CSRF_INVALID.
bigbike.cookies.domain=${BIGBIKE_COOKIES_DOMAIN:}

# Reverse-proxy IPs trusted to set X-Forwarded-For (rate limiting keys the bucket on the
# real client IP). Comma-separated; each entry is an exact IP or a narrow, private,
# network-aligned CIDR (minimum IPv4 /24, IPv6 /64) — e.g. 172.20.0.0/24. A broad range
# such as 172.16.0.0/12 is rejected at startup.
# Default covers localhost only. When the backend runs behind nginx or in
# Docker, set BIGBIKE_TRUSTED_PROXIES to the proxy IP / Docker bridge subnet — otherwise
# every external request shares one bucket and per-IP rate limiting collapses.
# See docs/engineering/DEPLOYMENT_GUIDE.md.
bigbike.trusted-proxies=${BIGBIKE_TRUSTED_PROXIES:127.0.0.1,::1}

# Rate limiting. Local/dev uses a bounded in-process store. Production must set Redis
# and an independent HMAC secret; the startup validator rejects an unsafe prod setup.
# See docs/engineering/RATE_LIMITING.md for tier defaults and override syntax.
bigbike.rate-limit.enabled=${BIGBIKE_RATE_LIMIT_ENABLED:true}
bigbike.rate-limit.store=${BIGBIKE_RATE_LIMIT_STORE:local}
bigbike.rate-limit.redis-url=${BIGBIKE_RATE_LIMIT_REDIS_URL:}
bigbike.rate-limit.redis-timeout-millis=${BIGBIKE_RATE_LIMIT_REDIS_TIMEOUT_MS:100}
bigbike.rate-limit.hmac-secret=${BIGBIKE_RATE_LIMIT_HMAC_SECRET:}
bigbike.rate-limit.fallback-max-entries=${BIGBIKE_RATE_LIMIT_FALLBACK_MAX_ENTRIES:50000}
bigbike.rate-limit.local-entry-ttl-multiplier=${BIGBIKE_RATE_LIMIT_LOCAL_ENTRY_TTL_MULTIPLIER:2}

# Redis is used directly by the distributed rate limiter; BigBike has no Spring Data Redis
# repositories. Disable repository discovery to avoid accidental repository binding/noisy startup.
spring.data.redis.repositories.enabled=false

# The starter still auto-configures a connection factory that backs the Redis health
# indicator, and its default target is localhost — inside a container that is nothing.
# Point it at the same instance the limiter uses, or /actuator/health reports DOWN and the
# container is killed as unhealthy while Redis is actually fine.
spring.data.redis.host=${BIGBIKE_REDIS_HOST:localhost}
spring.data.redis.port=${BIGBIKE_REDIS_PORT:6379}

# JWT configuration
bigbike.jwt.secret=${BIGBIKE_JWT_SECRET:dev-change-me-in-production-needs-32chars!!}
bigbike.jwt.access-token-ttl-seconds=${BIGBIKE_JWT_ACCESS_TTL:900}
bigbike.jwt.refresh-token-ttl-seconds=${BIGBIKE_JWT_REFRESH_TTL:604800}

# MinIO — admin media upload
bigbike.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
bigbike.minio.access-key=${MINIO_ROOT_USER:minio_admin}
bigbike.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_dev_only}
bigbike.minio.bucket=${MINIO_BUCKET:bigbike-media}

# Media URLs persisted by admin write paths must stay under this public MinIO base URL.
bigbike.media.public-base-url=${BIGBIKE_MEDIA_PUBLIC_BASE_URL:${MINIO_ENDPOINT:http://localhost:9000}/${MINIO_BUCKET:bigbike-media}}

# Transactional email (JavaMailSender) — optional; all senders degrade gracefully when absent.
# Set BIGBIKE_MAIL_HOST to enable. For Gmail use smtp.gmail.com:587 with an App Password.
spring.mail.host=${BIGBIKE_MAIL_HOST:}
spring.mail.port=${BIGBIKE_MAIL_PORT:587}
spring.mail.username=${BIGBIKE_MAIL_USERNAME:}
spring.mail.password=${BIGBIKE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${BIGBIKE_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${BIGBIKE_MAIL_STARTTLS:true}
bigbike.mail.from=${BIGBIKE_MAIL_FROM:no-reply@bigbike.vn}
bigbike.mail.from-name=${BIGBIKE_MAIL_FROM_NAME:BigBike}
# Shared internal recipient for order and staff-handoff notifications. The deployment
# env-file is the only source of the value; a missing value is rejected at startup.
bigbike.mail.admin=${BIGBIKE_MAIL_ADMIN:}
bigbike.mail.verify-base-url=${BIGBIKE_MAIL_VERIFY_BASE_URL:https://bigbike.vn/xac-nhan-email}
bigbike.mail.reset-base-url=${BIGBIKE_MAIL_RESET_BASE_URL:https://bigbike.vn/quen-mat-khau}
bigbike.mail.admin-invite-base-url=${BIGBIKE_MAIL_ADMIN_INVITE_BASE_URL:http://localhost:4000/accept-invite}
bigbike.site.base-url=${BIGBIKE_SITE_BASE_URL:https://bigbike.vn}
bigbike.admin.base-url=${BIGBIKE_ADMIN_BASE_URL:https://admin.bigbike.vn}

# Automatic review moderation (REVIEW_RULE_012/013). An empty key is a supported state:
# the moderator reports SKIPPED and every review stays in Pending. The on/off switch and
# the four violation categories are settings rows, not properties — see the
# `review_moderation` group in API_CONTRACT.md.
# Shared backend-only Gemini credential. The legacy review property remains an alias so
# existing deployments/tests keep working while BigBike Assistant becomes the second independent consumer.
bigbike.ai.gemini-api-key=${GEMINI_API_KEY:}
bigbike.review-moderation.gemini-api-key=${GEMINI_API_KEY:}
bigbike.review-moderation.model=${BIGBIKE_REVIEW_MODERATION_MODEL:gemini-2.5-flash}
bigbike.review-moderation.timeout-seconds=${BIGBIKE_REVIEW_MODERATION_TIMEOUT_SECONDS:20}
bigbike.chat.model=${BIGBIKE_CHAT_MODEL:gemini-2.5-flash}
bigbike.chat.fallback-model=${BIGBIKE_CHAT_FALLBACK_MODEL:gemini-2.5-flash-lite}
bigbike.chat.primary-timeout-seconds=${BIGBIKE_CHAT_PRIMARY_TIMEOUT_SECONDS:35}
bigbike.chat.timeout-seconds=${BIGBIKE_CHAT_TIMEOUT_SECONDS:65}
bigbike.chat.model-catalog-cache-minutes=${BIGBIKE_CHAT_MODEL_CATALOG_CACHE_MINUTES:15}
bigbike.chat.evaluation-max-cost-usd=${BIGBIKE_CHAT_EVALUATION_MAX_COST_USD:2.00}
bigbike.chat.input-cost-usd-per-million=${BIGBIKE_CHAT_INPUT_COST_USD_PER_MILLION:0.30}
bigbike.chat.output-cost-usd-per-million=${BIGBIKE_CHAT_OUTPUT_COST_USD_PER_MILLION:2.50}
bigbike.minio.chat-private-bucket=${MINIO_CHAT_PRIVATE_BUCKET:bigbike-chat-private}

# Next.js on-demand revalidation — set both to enable cache purging after admin mutations
bigbike.web.revalidate-url=${WEB_REVALIDATE_URL:}
bigbike.web.revalidate-secret=${WEB_REVALIDATE_SECRET:}
bigbike.web.redirect-cache-clear-url=${WEB_REDIRECT_CACHE_CLEAR_URL:}
bigbike.web.revalidate-expected-replicas=${WEB_REVALIDATE_EXPECTED_REPLICAS:0}

# Social login (OAuth2) — blank client id/secret keeps a provider disabled
bigbike.oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
bigbike.oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
bigbike.oauth.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID:}
bigbike.oauth.facebook.client-secret=${OAUTH_FACEBOOK_CLIENT_SECRET:}
bigbike.oauth.callback-base-url=${OAUTH_CALLBACK_BASE_URL:http://localhost:8080}
bigbike.oauth.web-success-url=${OAUTH_WEB_SUCCESS_URL:http://localhost:3000}

# Shared secret for internal endpoints (/api/internal/**) consumed by bigbike-web proxy.
# When set, all callers must send the same value in the X-Internal-Token header.
# Leave empty in local dev; set a random string in staging/prod via BIGBIKE_INTERNAL_TOKEN.
bigbike.internal.token=${BIGBIKE_INTERNAL_TOKEN:}

# Admin maintenance lock (MaintenanceWriteLockFilter). Rejects admin writes with 423 while
# state=ACTIVE; the storefront is never affected. Break-glass only: set to false when the
# lock itself misbehaves and has bricked the admin panel.
bigbike.maintenance.lock-enabled=${BIGBIKE_MAINTENANCE_LOCK_ENABLED:true}

# Dev header auth bypass — MUST be false in production; only set true in dev/test environments
bigbike.auth.dev-header-enabled=false

# Multipart upload limits — match the 200 MB cap enforced in AdminMediaService
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Actuator — expose health + show details for diagnosis (prod overrides with show-details=never)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── OpenAPI / Swagger UI (springdoc) ────────────────────────────────────────
# Hợp đồng chuẩn vẫn là file biên tập tay openapi/bigbike-openapi.json, phục vụ ở
# /v3/api-docs (OpenApiStaticController). springdoc sinh bản "live" từ chính controller
# đang chạy ở đường dẫn riêng, dùng để đối chiếu lệch hợp đồng và thử API.
#
# TẮT MẶC ĐỊNH ở mọi profile: bản đồ toàn bộ API là thông tin trinh sát cho kẻ tấn công và
# SecurityConfig cho phép truy cập /v3/api-docs/** + /swagger-ui/** không cần đăng nhập.
# Chỉ bật trên máy lập trình viên bằng BIGBIKE_API_DOCS_ENABLED=true.
# Profile prod ép về false cứng (application-prod.properties) — biến môi trường không mở được.
springdoc.api-docs.enabled=${BIGBIKE_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${BIGBIKE_API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs/live
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.bigbike.bigbike_backend.api
# Khoá thứ tự khoá JSON để bản sinh ra ổn định giữa các lần chạy (so sánh/diff mới có nghĩa).
springdoc.writer-with-order-by-keys=true
