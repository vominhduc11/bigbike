# ── Production profile overrides ────────────────────────────────────────────
# This file is loaded when SPRING_PROFILES_ACTIVE contains "prod".
# Secrets must come from environment variables — no plaintext values here.

# Flyway: prod only runs versioned migrations, never dev-seed data
spring.flyway.locations=classpath:db/migration

# Logging: structured JSON output for log aggregators (Loki/ELK)
logging.level.root=WARN
logging.level.com.bigbike=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.charset.console=UTF-8

# Disable SpringDoc / Swagger UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: expose only health, info, metrics, prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HTTP: timeouts. Hikari pool sizing and response compression moved to application.properties
# (base) — they were prod-profile-only, but the actual server deployment runs the "dev"
# Spring profile (Flyway needs out-of-order for the dev-seed migrations), which silently
# left compression OFF and the pool at Hikari's 10-connection default in production. See
# BIGBIKE_PERFORMANCE_AUDIT_CHECKLIST.md — profile should only decide Flyway/logging/dev
# tooling, not whether responses are compressed.
server.tomcat.connection-timeout=20s
