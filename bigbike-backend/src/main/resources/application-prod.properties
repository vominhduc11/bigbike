# ── Production profile overrides ────────────────────────────────────────────
# This file is loaded when SPRING_PROFILES_ACTIVE contains "prod".
# Secrets must come from environment variables — no plaintext values here.

# Flyway: prod only runs versioned migrations, never dev-seed data
spring.flyway.locations=classpath:db/migration

# Logging: structured JSON output for log aggregators (Loki/ELK)
logging.level.root=WARN
logging.level.com.bigbike=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.charset.console=UTF-8

# Disable SpringDoc / Swagger UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: expose only health, info, metrics, prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# Container liveness must not depend on an external SMTP provider: /actuator/health
# is the Docker healthcheck, and bigbike-web/bigbike-admin wait on it via
# depends_on: service_healthy. A Gmail outage would otherwise mark the backend
# unhealthy and stop the whole stack from coming up. Mail failures surface in logs
# and in the admin notification flow instead.
management.health.mail.enabled=false
management.endpoint.prometheus.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HTTP: timeouts. Hikari pool sizing and response compression live in application.properties
# (base) — they used to be prod-profile-only while the server deployment actually ran the
# "dev" profile (Flyway needed the dev-seed migrations), which silently left compression OFF
# and the pool at Hikari's 10-connection default in production. Since the 2026-08-06 domain
# cutover the deployment runs "prod" (dev-seed migrations already applied are skipped via
# SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS=*:missing in .env.vps), but the settings stay in
# base: profile should only decide Flyway/logging/dev tooling, not whether responses are
# compressed. See BIGBIKE_PERFORMANCE_AUDIT_CHECKLIST.md.
server.tomcat.connection-timeout=20s
