<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Khách đang chờ gặp nhân viên — BigBike Admin</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f6f8;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f6f8">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr th:replace="~{email/layout :: header-row}"></tr>
        <tr>
          <td style="background-color:#ffffff;padding:32px;border-left:1px solid #e5e7eb;border-right:1px solid #e5e7eb;">
            <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#151515;">
              Khách đang chờ gặp nhân viên
            </h1>
            <p style="margin:0 0 24px;font-size:15px;color:#4b5563;">
              Mở hội thoại để tiếp nhận sớm; trợ lý vẫn đang phục vụ khách trong lúc chờ.
            </p>
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="border:1px solid #e5e7eb;margin-bottom:24px;">
              <tr>
                <td style="padding:16px;font-size:13px;color:#6b7280;">Khách</td>
                <td align="right" style="padding:16px;font-size:14px;color:#151515;"
                    th:text="${customerKind}">Khách lạ</td>
              </tr>
              <tr>
                <td colspan="2" style="border-top:1px solid #e5e7eb;padding:16px;">
                  <div style="font-size:13px;color:#6b7280;margin-bottom:6px;">Khách đang hỏi</div>
                  <div style="font-size:15px;color:#151515;line-height:1.5;" th:text="${question}">
                    Chưa có câu hỏi
                  </div>
                </td>
              </tr>
              <tr th:if="${products != null and !products.isEmpty()}">
                <td colspan="2" style="border-top:1px solid #e5e7eb;padding:16px;">
                  <div style="font-size:13px;color:#6b7280;margin-bottom:6px;">Mẫu đã xem</div>
                  <div th:each="product : ${products}" th:text="${product.name}"
                       style="font-size:14px;color:#151515;line-height:1.5;">Tên sản phẩm</div>
                </td>
              </tr>
            </table>
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#151515;">
                  <a th:href="${adminChatUrl}" href="#"
                     style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;">
                    Mở hội thoại và tiếp nhận →
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr th:replace="~{email/layout :: footer-row}"></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
