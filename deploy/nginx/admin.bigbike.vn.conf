# ⚠️  KHÔNG PHẢI FILE ĐANG CHẠY TRÊN MÁY CHỦ (kiểm chứng 2026-08-06).
#
# Máy chủ nạp cấu hình từ /etc/nginx/sites-enabled/ -> /etc/nginx/sites-available/<host>
# (tên file KHÔNG có đuôi .conf, và bigbike.vn là symlink tới bigbike.vn.nextjs).
# Nội dung bên đó KHÁC file này. Sửa file này KHÔNG có hiệu lực gì trên production.
#
# Copy đè file này lên máy chủ sẽ XOÁ MẤT các sửa đổi đang chạy thật, trong đó có:
#   - location /ws trên admin.bigbike.vn (WebSocket: chuông báo đơn + thông báo bảo trì)
#   - error_page 502/503/504 -> trang xin lỗi khách ở /var/www/bigbike-static/maintenance/
# Luôn `diff` với bản live trước khi triển khai. Xem DEPLOYMENT_GUIDE.md §Nginx.

# ==============================================================================
# Nginx Configuration for admin.bigbike.vn (Admin Dashboard — Vite/React)
# Requires shared-config.conf for upstream definitions.
# ==============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.bigbike.vn;

    access_log /var/log/nginx/admin.bigbike.vn-http-access.log;
    error_log /var/log/nginx/admin.bigbike.vn-http-error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Admin Dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.bigbike.vn;

    # ==================== SSL ====================
    ssl_certificate /etc/ssl/admin.bigbike.vn/fullchain.crt;
    ssl_certificate_key /etc/ssl/admin.bigbike.vn/private.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AdminSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==================== Security Headers ====================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==================== Logs ====================
    access_log /var/log/nginx/admin.bigbike.vn-access.log;
    error_log /var/log/nginx/admin.bigbike.vn-error.log warn;

    error_page 502 503 504 =503 /__bigbike_maintenance.html;
    location = /__bigbike_maintenance.html {
        internal;
        alias /var/www/bigbike-static/maintenance/maintenance-admin.html;
        default_type text/html;
        charset utf-8;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
    }

    # ==================== Client Settings ====================
    client_body_timeout 60s;
    client_header_timeout 30s;
    client_max_body_size 20m;

    # ==================== Proxy to Admin (Vite SPA) ====================
    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append a client-supplied XFF value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
    }
}
