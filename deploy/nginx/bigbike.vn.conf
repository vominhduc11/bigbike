# ⚠️  KHÔNG PHẢI FILE ĐANG CHẠY TRÊN MÁY CHỦ (kiểm chứng 2026-08-06).
#
# Máy chủ nạp cấu hình từ /etc/nginx/sites-enabled/ -> /etc/nginx/sites-available/<host>
# (tên file KHÔNG có đuôi .conf, và bigbike.vn là symlink tới bigbike.vn.nextjs).
# Nội dung bên đó KHÁC file này. Sửa file này KHÔNG có hiệu lực gì trên production.
#
# Copy đè file này lên máy chủ sẽ XOÁ MẤT các sửa đổi đang chạy thật, trong đó có:
#   - location /ws trên admin.bigbike.vn (WebSocket: chuông báo đơn + thông báo bảo trì)
#   - error_page 502/503/504 -> trang xin lỗi khách ở /var/www/bigbike-static/maintenance/
# Luôn `diff` với bản live trước khi triển khai. Xem DEPLOYMENT_GUIDE.md §Nginx.

# ==============================================================================
# Nginx Configuration for bigbike.vn (Main Website — Next.js)
# Requires shared-config.conf for upstream and rate-limit zone definitions.
# Requires bigbike-seo-redirects-map.conf (cùng thư mục) cài vào conf.d/ —
# nó định nghĩa $bigbike_seo_redirect dùng ở khối "SEO Product 301 Redirects"
# bên dưới. Thiếu file map thì nginx báo unknown variable và KHÔNG khởi động.
#
# Bản đang chạy trên VPS = /etc/nginx/sites-available/bigbike.vn.nextjs.
# File này đã được đồng bộ với bản đó ngày 2026-08-06; trước đó repo thiếu
# khối SEO redirect + llms.txt nên copy đè sẽ mất 169 chuyển hướng đang sống.
# ==============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name bigbike.vn www.bigbike.vn;

    access_log /var/log/nginx/bigbike.vn-http-access.log;
    error_log /var/log/nginx/bigbike.vn-http-error.log;

    location / {
        return 301 https://bigbike.vn$request_uri;
    }
}

# www → canonical redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bigbike.vn;

    ssl_certificate /etc/ssl/bigbike.vn/fullchain.crt;
    ssl_certificate_key /etc/ssl/bigbike.vn/private.key;

    location / {
        return 301 https://bigbike.vn$request_uri;
    }
}

# HTTPS — Main Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bigbike.vn;

    # ==================== SSL ====================
    ssl_certificate /etc/ssl/bigbike.vn/fullchain.crt;
    ssl_certificate_key /etc/ssl/bigbike.vn/private.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MainSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==================== Security Headers ====================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # KHÔNG thêm X-Frame-Options ở đây. Next.js đã tự gửi CSP `frame-ancestors`
    # ('none' cho mọi route, riêng /preview/* cho phép NEXT_PUBLIC_ADMIN_ORIGIN =
    # https://admin.bigbike.vn nhúng live preview). X-Frame-Options chỉ có DENY/
    # SAMEORIGIN nên nó chặn luôn iframe preview hợp lệ và không thể allow theo
    # origin — thêm lại sẽ làm hỏng khung Xem trước trong admin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==================== Logs ====================
    access_log /var/log/nginx/bigbike.vn-access.log;
    access_log /var/log/nginx/bigbike-rate-limit.json bigbike_rate_limit_json if=$bigbike_rate_limit_log;
    error_log /var/log/nginx/bigbike.vn-error.log warn;

    error_page 502 503 504 =503 /__bigbike_maintenance.html;
    location = /__bigbike_maintenance.html {
        internal;
        alias /var/www/bigbike-static/maintenance/maintenance-web.html;
        default_type text/html;
        charset utf-8;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
    }

    # Native Nginx throttling uses the same JSON error shape as API/BFF calls. Upstream
    # responses are not intercepted in the proxy location, so backend 429 bodies survive.
    error_page 429 = @rate_limited_web;
    location @rate_limited_web {
        internal;
        default_type application/json;
        charset utf-8;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        add_header X-Request-Id $request_id always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Quá nhiều yêu cầu. Vui lòng thử lại sau.","details":[]},"meta":{"requestId":"$request_id","timestamp":"$time_iso8601"}}';
    }

    # ==================== Client Settings ====================
    client_body_timeout 60s;
    client_header_timeout 15s;
    client_max_body_size 10m;
    send_timeout 60s;
    reset_timedout_connection on;
    limit_conn per_ip_connections 20;

    # ==================== SEO Product 301 Redirects ====================
    # 189 luật dọn dẹp sản phẩm ngừng bán, giữ y nguyên như cấu hình WordPress cũ
    # (bigbike-seo-redirects-map.conf). Chỉ 20/189 luật này có trong bảng redirects
    # của web mới, nên bỏ khối này là mất 169 chuyển hướng đang chạy tốt. Đích của
    # chúng là các URL danh mục .html — đã bổ sung luật trong CSDL ngày 2026-08-06
    # nên chuỗi chuyển hướng kết thúc ở trang 200.
    if ($bigbike_seo_redirect) {
        return 301 $bigbike_seo_redirect;
    }

    # ==================== llms.txt ====================
    # Bản hướng dẫn cho trợ lý AI, mang nguyên từ web WordPress cũ (thư mục gốc).
    # Phục vụ thẳng ở đây để khỏi phải dựng lại bigbike-web. Về lâu dài nên chuyển
    # file này vào bigbike-web/public/ rồi bỏ khối này đi.
    location = /llms.txt {
        alias /var/www/bigbike-static/llms.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ==================== Proxy to Next.js ====================
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        limit_conn per_ip_connections 12;

        proxy_pass http://main_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append a client-supplied XFF value. The backend/BFF
        # deliberately consume the first address for per-client rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }
}
