services:
  db:
    image: mariadb:10.11
    container_name: bigbike-etl-db
    environment:
      MYSQL_ROOT_PASSWORD: ${ETL_DB_ROOT_PASSWORD:-bigbike_etl_root}
      MYSQL_DATABASE: ${ETL_DB_NAME:-bigbike_wp}
      MYSQL_USER: ${ETL_DB_USER:-etl_user}
      MYSQL_PASSWORD: ${ETL_DB_PASSWORD:-etl_pass}
    volumes:
      # The raw WordPress dump is external and intentionally not stored in this repo.
      # Set ETL_WP_SQL_DUMP to an absolute path before starting the optional ETL stack.
      - ${ETL_WP_SQL_DUMP:?Set ETL_WP_SQL_DUMP to an external SQL dump}:/docker-entrypoint-initdb.d/01-dump.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 10
