# Standalone CI project: never extend the shop Compose or load its .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bigbike_perf
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: ${PERF_PASSWORD:?CI credential required}
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, shared_buffers=128MB, -c, max_connections=100]
    mem_limit: 1g
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U perf -d bigbike_perf"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: perf_minio
      MINIO_ROOT_PASSWORD: ${PERF_PASSWORD:?CI credential required}
    mem_limit: 512m
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
  bigbike-backend:
    image: ${PERF_TAG:?CI image required}-backend
    mem_limit: 2g
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/fixtures
      BIGBIKE_DB_URL: jdbc:postgresql://postgres:5432/bigbike_perf
      BIGBIKE_DB_USERNAME: perf
      BIGBIKE_DB_PASSWORD: ${PERF_PASSWORD}
      BIGBIKE_SEED_ADMIN_EMAIL: perf-admin@example.invalid
      BIGBIKE_SEED_ADMIN_PASSWORD: ${PERF_PASSWORD}
      BIGBIKE_JWT_SECRET: ${PERF_JWT:?CI JWT required}
      BIGBIKE_REDIS_HOST: redis
      BIGBIKE_RATE_LIMIT_ENABLED: "true"
      BIGBIKE_RATE_LIMIT_STORE: redis
      BIGBIKE_RATE_LIMIT_REDIS_URL: redis://redis:6379
      BIGBIKE_RATE_LIMIT_HMAC_SECRET: ${PERF_JWT}
      BIGBIKE_TRUSTED_PROXIES: 127.0.0.1,::1,172.29.239.0/24
      BIGBIKE_AUTH_DEV_HEADER_ENABLED: "false"
      BIGBIKE_INGRESS_BOUNDARY_ENABLED: "true"
      BIGBIKE_INGRESS_SHARED_HOSTS: localhost,127.0.0.1
      BIGBIKE_INTERNAL_ALLOW_OPEN: "false"
      BIGBIKE_INTERNAL_TOKEN: ${PERF_JWT}
      WEB_REVALIDATE_URL: ${PERF_WEB_REVALIDATE_URL:-}
      WEB_REVALIDATE_SECRET: ${PERF_JWT}
      WEB_REVALIDATE_EXPECTED_REPLICAS: ${PERF_WEB_REVALIDATE_REPLICAS:-0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: perf_minio
      MINIO_ROOT_PASSWORD: ${PERF_PASSWORD}
      MINIO_BUCKET: bigbike-media
      BIGBIKE_MEDIA_PUBLIC_BASE_URL: http://localhost:19000/bigbike-media
      CORS_ALLOWED_ORIGINS: http://localhost:13000,http://localhost:14000
      BIGBIKE_MAIL_HOST: ""
      BIGBIKE_MAIL_ADMIN: perf-operations@example.invalid
      BIGBIKE_MAIL_FROM: perf-sender@example.invalid
      BIGBIKE_TELEGRAM_BOT_TOKEN: ""
      BIGBIKE_TELEGRAM_CHAT_ID: ""
      BIGBIKE_GA4_API_SECRET: ""
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ""
      GEMINI_API_KEY: ""
      BIGBIKE_REVIEW_INVITATION_ENABLED: "false"
      BIGBIKE_SITE_BASE_URL: http://localhost:13000
      BIGBIKE_ADMIN_BASE_URL: http://localhost:14000
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
    volumes:
      - ${PERF_FIXTURE_DIR:?Synthetic migration fixtures required}:/fixtures:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  bigbike-web:
    image: ${PERF_TAG}-web
    mem_limit: 1g
    environment:
      BIGBIKE_API_BASE_URL: http://bigbike-backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
      NEXT_PUBLIC_SITE_URL: http://localhost:13000
      BIGBIKE_DISABLE_DEV_FALLBACK: "true"
      BIGBIKE_INTERNAL_TOKEN: ${PERF_JWT}
      INTERNAL_API_TOKEN: ${PERF_JWT}
      REVALIDATE_SECRET: ${PERF_JWT}
      WEB_REVALIDATE_SECRET: ${PERF_JWT}
  bigbike-admin:
    image: ${PERF_TAG}-admin
    mem_limit: 128m
  api-proxy:
    image: nginx:alpine
    mem_limit: 128m
    volumes:
      - ${PERF_SCRIPT_DIR:?CI config directory required}/api.ci.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18080:80", "127.0.0.1:13000:81", "127.0.0.1:14000:82"]
    depends_on: [bigbike-backend]
networks:
  default:
    internal: true
    ipam:
      config: [{subnet: 172.29.239.0/24}]
