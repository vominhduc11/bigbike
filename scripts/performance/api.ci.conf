# Lab HTTP proxy: same documented normal API coarse budget, no TLS/CDN claim.
limit_req_zone $binary_remote_addr zone=perf_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=perf_general:10m rate=30r/s;
# CI-only diagnostic: connection counter, request ordinal and status only.
log_format perf_media_diag 'BBMEDIA $connection $connection_requests $status';
map $uri $perf_media_diag_enabled {
    default 0;
    ~^/api/v1/admin/media/[0-9a-fA-F-]+/download$ 1;
}
map $http_upgrade $perf_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    access_log /dev/stderr perf_media_diag if=$perf_media_diag_enabled;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 210m;
    limit_req_status 429;
    error_page 429 = @rate_rejected;
    location @rate_rejected {
        default_type application/json;
        charset utf-8;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Quá nhiều yêu cầu. Vui lòng thử lại sau.","details":[]},"meta":{"requestId":"$request_id","timestamp":"$time_iso8601"}}';
    }
    location / {
        limit_req zone=perf_api burst=20 nodelay;
        set $perf_backend http://bigbike-backend:8080;
        proxy_pass $perf_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

# Match the documented storefront/admin coarse budgets too. Variable upstreams
# resolve through Docker DNS after frontends start; only this job network exists.
server {
    listen 81;
    access_log off;
    resolver 127.0.0.11 valid=5s;
    limit_req_status 429;
    error_page 429 = @rate_rejected_web;
    location @rate_rejected_web {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Quá nhiều yêu cầu. Vui lòng thử lại sau.","details":[]},"meta":{"requestId":"$request_id","timestamp":"$time_iso8601"}}';
    }
    location / {
        limit_req zone=perf_general burst=30 nodelay;
        set $perf_web http://bigbike-web:3000;
        proxy_pass $perf_web$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
server {
    listen 82;
    access_log off;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 210m;
    limit_req_status 429;
    error_page 429 = @rate_rejected_admin;
    location @rate_rejected_admin {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Quá nhiều yêu cầu. Vui lòng thử lại sau.","details":[]},"meta":{"requestId":"$request_id","timestamp":"$time_iso8601"}}';
    }
    location /ws {
        set $perf_admin http://bigbike-admin:80;
        proxy_pass $perf_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $perf_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
    location / {
        limit_req zone=perf_general burst=30 nodelay;
        set $perf_admin http://bigbike-admin:80;
        proxy_pass $perf_admin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
